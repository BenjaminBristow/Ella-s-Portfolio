# ==============================================================================
# NETLIFY DEPLOYMENT CONFIGURATION // ELLA PORTFOLIO
# ==============================================================================

[build]
  # Publish directory containing index.html, style.css, and app.js
  publish = "web"
  
  # Copies assets folder into web/assets so all videos, moodboard files, 
  # and images are bundled and accessible on Netlify
  command = "mkdir -p web/assets && cp -R assets/* web/assets/ 2>/dev/null || true"

# Production environment
[context.production]
  command = "mkdir -p web/assets && cp -R assets/* web/assets/ 2>/dev/null || true"

# Pull request deploy previews
[context.deploy-preview]
  command = "mkdir -p web/assets && cp -R assets/* web/assets/ 2>/dev/null || true"

# Branch deploys
[context.branch-deploy]
  command = "mkdir -p web/assets && cp -R assets/* web/assets/ 2>/dev/null || true"

# Route shortcut: /moodboard directly loads the marketing moodboard
[[redirects]]
  from = "/moodboard"
  to = "/assets/Marketing Mood Board.html"
  status = 200

# Global Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# HTML Files: revalidate to ensure immediate updates after each git push
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache static assets (CSS, JS, Fonts, Media) for high performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

